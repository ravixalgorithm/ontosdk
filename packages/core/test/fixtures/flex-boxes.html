<!doctype html>
<html lang="en">
<head><title>Flex boxes</title></head>
<body>
<main>
  <p>Inline <strong>bold</strong>word and <em>em</em>phasis stay intact.</p>
  <div class="flex flex-wrap gap-1.5" role="group"><span class="contents"><span class="inline-flex rounded-full px-2">click</span></span><span class="contents"><span class="inline-flex rounded-full px-2">zoom</span></span><span class="contents"><span class="inline-flex rounded-full px-2">zoomOut</span></span></div>
  <ul>
    <li class="flex items-center gap-3"><span class="size-3 rounded-full"></span><span class="w-10 font-mono">PT-12</span><span class="flex-1 truncate">Billing shows a stale plan</span><span class="inline-flex rounded-full"><span aria-hidden="true" class="size-1.75 rounded-full"></span>Bug</span></li>
  </ul>
  <table>
    <thead><tr><th>Step</th><th>Why</th></tr></thead>
    <tbody><tr><td><span class="flex flex-col gap-0.5"><span>Settle</span><span>180ms</span></span></td><td>Eyes catch up.</td></tr></tbody>
  </table>
  <div class="flex items-center"><div class="inline-flex"><label class="inline-flex"><input type="checkbox" checked><span class="inline-flex">Camera</span></label></div><button type="button"><span class="contents">Pause</span></button></div>
  <p><span style="display:block">Styled</span><span>inline</span></p>
  <pre><code><span class="block">const a = 1;</span><span class="block">a</span></code></pre>
</main>
</body>
</html>
