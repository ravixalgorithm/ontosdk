<!DOCTYPE html>
<html lang="en">
<head>
  <title>Onto Pricing</title>
  <meta name="description" content="Pricing tiers for the Onto Read API." />
</head>
<body>
  <main>
    <h1>Pricing</h1>
    <p>Pick a plan. Cancel anytime.</p>

    <table>
      <thead>
        <tr>
          <th>Plan</th>
          <th>Price / mo</th>
          <th>Requests</th>
          <th>Concurrency</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Free</td>
          <td>$0</td>
          <td>1,000</td>
          <td>1</td>
        </tr>
        <tr>
          <td>Starter</td>
          <td><del>$19</del> $9</td>
          <td>50,000</td>
          <td>5</td>
        </tr>
        <tr>
          <td>Growth</td>
          <td>$49</td>
          <td>250,000</td>
          <td>20</td>
        </tr>
        <tr>
          <td>Scale</td>
          <td>$250</td>
          <td>2,000,000</td>
          <td>100</td>
        </tr>
      </tbody>
    </table>

    <h2>What's included</h2>
    <ul>
      <li>Clean Markdown extraction</li>
      <li>AIO score on every read</li>
    </ul>
  </main>
</body>
</html>
